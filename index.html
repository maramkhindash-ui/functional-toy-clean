  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بماذا ننظف الأوساخ؟</title>
<style>
  :root{
    --sand:#F4EEE1;
    --sand-deep:#E8DFC9;
    --ink:#3C342A;
    --ink-soft:#6B6154;
    --wood:#B9895A;
    --wood-deep:#8C6239;
    --sage:#6E8C68;
    --sage-deep:#4F6B4B;
    --alert:#C15A3C;
    --sky:#4E7FA8;
    --card:#FFFFFF;
    --shadow: 0 12px 28px rgba(60,52,36,0.14);
    --tray-h: clamp(140px, 21vh, 235px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--sand);
    font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif;
    color:var(--ink);
    overflow:hidden;
    touch-action: none;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    background:#111;
    overflow:hidden;
    touch-action:none;
  }
  .bg-blur{
    position:absolute;
    inset:-20px;
    width:calc(100% + 40px);
    height:calc(100% + 40px);
    object-fit:cover;
    filter: blur(28px) brightness(0.92) saturate(1.05);
    transform: scale(1.1);
  }
  .frame-flex{
    position:absolute;
    top:0; left:0; right:0;
    bottom: var(--tray-h);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- FLOATING TOP BAR ---------- */
  .top-bar{
    position:absolute;
    top:0; left:0; right:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding: clamp(14px,2.4vh,26px) clamp(14px,2.4vw,28px) 0;
  }
  .title-pill{
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: clamp(8px,1.2vh,14px) clamp(18px,3vw,30px);
    text-align:center;
    box-shadow: var(--shadow);
    max-width: min(92%, 620px);
  }
  .eyebrow-free-title{
    font-size: clamp(18px, 2.6vh, 28px);
    font-weight:800;
    color:var(--ink);
    margin:0;
    letter-spacing:0.2px;
  }
  .subtitle{
    margin:3px 0 0;
    font-size:clamp(12.5px, 1.5vh, 16px);
    color:var(--ink-soft);
    font-weight:600;
  }
  .progress-pill{
    position:absolute;
    top: clamp(14px,2.4vh,26px);
    left: clamp(14px,2.4vw,28px);
    z-index:20;
    background: var(--card);
    border-radius: 999px;
    padding: clamp(6px,0.9vw,10px) clamp(12px,1.6vw,18px);
    font-size:clamp(12.5px,1.6vw,16px);
    font-weight:700;
    color:var(--wood-deep);
    box-shadow: var(--shadow);
  }

  /* ---------- ROOM / STAGE ---------- */
  .stage-wrap{
    position:relative;
    max-width:100%;
    max-height:100%;
    width:100%;
    aspect-ratio: 1000 / 564;
    overflow:hidden;
  }
  .room-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
    object-position: center center;
    display:block;
  }
  .mess{
    position:absolute;
    width: 12%;
    transform: translate(-50%,-50%);
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.18));
    transition: opacity .55s ease-in, transform .55s ease-in;
    cursor: default;
  }
  .mess img{
    width:100%;
    display:block;
    pointer-events:none;
    animation: softGlow 3.4s ease-in-out infinite;
  }
  @keyframes softGlow{
    0%,100%{ filter: drop-shadow(0 0 0 rgba(255,214,140,0)) brightness(1); }
    50%{ filter: drop-shadow(0 0 10px rgba(255,214,140,0.75)) brightness(1.12); }
  }
  .mess.gone{
    opacity:0;
    transform: translate(-50%,-50%) scale(0.15);
  }

  .toast{
    position:absolute;
    left:50%;
    top:22%;
    transform: translateX(-50%) translateY(-140%);
    background: var(--alert);
    color:#fff;
    font-weight:700;
    font-size:14px;
    padding:9px 18px;
    border-radius:14px;
    box-shadow: var(--shadow);
    transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .28s ease;
    opacity:0;
    white-space:nowrap;
    z-index:30;
    pointer-events:none;
  }
  .toast.show{
    transform: translateX(-50%) translateY(0);
    opacity:1;
  }
  .toast.good{ background: var(--sage-deep); }

  /* ---------- FLOATING BOTTOM BAR ---------- */
  .bottom-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    height: var(--tray-h);
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 0 clamp(14px,2.4vw,28px);
    gap: clamp(6px,1vh,12px);
  }
  .tray{
    width:100%;
    max-width: 620px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap: clamp(10px,2vw,28px);
  }
  .slot{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: clamp(6px,1vw,12px);
  }
  .slot-pad{
    width:100%;
    aspect-ratio: 1 / 1;
    max-height: calc(var(--tray-h) - 62px);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .tool{
    width:80%;
    max-height:84%;
    object-fit:contain;
    cursor: grab;
    touch-action:none;
    position:relative;
    z-index:5;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.16));
  }
  .tool.dragging{
    z-index:100;
    cursor:grabbing;
  }
  .tool-label{
    font-size: clamp(12px, 1.5vh, 16px);
    font-weight:700;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.82);
    padding: 2px 10px;
    border-radius: 999px;
  }
  .hint{
    text-align:center;
    font-size: clamp(11.5px, 1.4vh, 15px);
    color: var(--ink-soft);
    font-weight:700;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(6px);
    padding: 6px 16px;
    border-radius: 999px;
  }

  /* ---------- SUCCESS SCREEN ---------- */
  #success{
    position:absolute;
    inset:0;
    background: var(--sand);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 28px 24px;
    overflow-y:auto;
    z-index: 200;
  }
  #success.show{ display:flex; }
  .success-badge{
    width:96px; height:96px;
    border-radius:50%;
    background: var(--sage);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
    margin-bottom:14px;
    flex-shrink:0;
  }
  .success-badge svg{ width:48px; height:48px; }
  .success-title{
    font-size:21px;
    font-weight:800;
    margin: 0 0 4px;
    text-align:center;
  }
  .success-sub{
    font-size:14px;
    color: var(--ink-soft);
    font-weight:600;
    text-align:center;
    margin:0 0 20px;
  }
  .steps-card{
    background: var(--card);
    border-radius:20px;
    padding: 18px 18px 20px;
    width:100%;
    max-width:420px;
    box-shadow: var(--shadow);
  }
  .steps-card h3{
    margin:0 0 10px;
    font-size:15.5px;
    font-weight:800;
    color: var(--wood-deep);
  }
  .steps-card h3:not(:first-child){ margin-top:16px; }
  .steps-list{
    margin:0;
    padding-inline-start: 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .steps-list li{
    font-size:13.5px;
    line-height:1.5;
    color: var(--ink);
  }
  .materials{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .materials span{
    background: var(--sand-deep);
    color: var(--wood-deep);
    font-size:12.5px;
    font-weight:700;
    padding:5px 12px;
    border-radius:999px;
  }
  .note{
    margin-top:14px;
    font-size:12px;
    color: var(--sky);
    font-weight:700;
    background: #EAF1F6;
    padding:9px 12px;
    border-radius:12px;
  }
  .replay-btn{
    margin-top:20px;
    background: var(--wood-deep);
    color:#fff;
    border:none;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    padding: 13px 30px;
    border-radius:999px;
    box-shadow: var(--shadow);
    cursor:pointer;
    flex-shrink:0;
  }
  .replay-btn:active{ transform: scale(0.97); }

  /* ---------- START SCREEN ---------- */
  #startScreen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    background: linear-gradient(180deg, rgba(20,16,10,0.18) 0%, rgba(20,16,10,0.58) 100%);
    transition: opacity .45s ease;
  }
  #startScreen.hidden{
    opacity:0;
    pointer-events:none;
  }
  .start-title-wrap{
    position:absolute;
    top: clamp(18px,4vh,40px);
    left:0; right:0;
    display:flex;
    justify-content:center;
    padding: 0 20px;
  }
  .start-title-wrap .title-pill{
    max-width:min(92%,560px);
  }
  .start-btn{
    margin-bottom: clamp(36px,8vh,90px);
    background: var(--sage-deep);
    color:#fff;
    border:none;
    font-family:inherit;
    display:flex;
    align-items:center;
    gap:10px;
    font-size: clamp(17px,2.4vh,22px);
    font-weight:800;
    padding: clamp(14px,2vh,20px) clamp(34px,5vw,54px);
    border-radius:999px;
    box-shadow: 0 14px 30px rgba(60,52,36,0.28);
    cursor:pointer;
  }
  .start-btn:active{ transform: scale(0.96); }
  .start-btn svg{ width:22px; height:22px; }

  .pre-start .top-bar,
  .pre-start .bottom-bar,
  .pre-start .progress-pill{
    visibility:hidden;
  }
</style>
</head>

  {id:"tissue1",  asset:"tissue",  x:10, y:88, w:8,   rot:-6},
  {id:"leaf1",    asset:"leaf",    x:22, y:64, w:7,   rot:10},

  {id:"dirt1",    asset:"dirt",    x:70, y:66, w:10,  rot:0},
  {id:"tissue2",  asset:"tissue",  x:82, y:86, w:7,   rot:14},
  {id:"leaf2",    asset:"leaf",    x:93, y:62, w:6.5, rot:-16},
  {id:"wrapper2", asset:"wrapper", x:15, y:74, w:6.5, rot:18},
  {id:"apple2",   asset:"apple",   x:64, y:90, w:7,   rot:-4},
  {id:"banana2",  asset:"banana",  x:40, y:70, w:8,   rot:20},
  {id:"dirt2",    asset:"dirt",    x:52, y:88, w:9,   rot:0},
];

const stage = document.getElementById('stage');
const toast = document.getElementById('toast');
const progressPill = document.getElementById('progressPill');
const total = MESS_LAYOUT.length;
let cleaned = 0;

// ---- Sound ----
const sndStart = document.getElementById('sndStart');
const sndNarration = document.getElementById('sndNarration');
const sndVacuum = document.getElementById('sndVacuum');
const sndTryAgain = document.getElementById('sndTryAgain');

function safeSeekToStart(audioEl){
  try{
    if(audioEl.readyState >= 1){ audioEl.currentTime = 0; }
  }catch(e){}
}

function playSound(audioEl){
  safeSeekToStart(audioEl);
  const p = audioEl.play();
  if(p && p.catch) p.catch(()=>{});
}

function buildMess(){
  MESS_LAYOUT.forEach(item=>{
    const el = document.createElement('div');
    el.className = 'mess';
    el.id = 'mess-' + item.id;
    el.style.left = item.x + '%';
    el.style.top = item.y + '%';
    el.style.width = item.w + '%';
    el.style.setProperty('--rot', item.rot + 'deg');
    el.style.transform = `translate(-50%,-50%) rotate(${item.rot}deg)`;
    const img = document.createElement('img');
    img.src = MESS_ASSETS[item.asset || item.id];
    el.appendChild(img);
    stage.appendChild(el);
  });
}
buildMess();

let toastTimer = null;
function showToast(msg, good){
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.toggle('good', !!good);
  toast.classList.add('show');
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 1100);
}

function updateProgress(){
  progressPill.textContent = cleaned + ' / ' + total;
}
updateProgress();

function getMessElements(){
  return Array.from(stage.querySelectorAll('.mess:not(.gone)'));
}

function cleanupMess(el, vacuumRect){
  el.classList.add('gone');
  cleaned++;
  updateProgress();
  setTimeout(()=>{ el.remove(); }, 560);
  if(cleaned >= total){
    setTimeout(()=>{
      document.getElementById('success').classList.add('show');
    }, 800);
  }
}

// ---- Drag logic ----
function setupDrag(toolId){
  const tool = document.getElementById('tool-' + toolId);
  const slotPad = tool.parentElement;

  let dragging = false;
  let startX, startY, origLeft, origTop, pointerId;

  function stageRect(){ return stage.getBoundingClientRect(); }

  function onPointerDown(e){
    e.preventDefault();
    dragging = true;
    pointerId = e.pointerId;
    tool.setPointerCapture(pointerId);
    tool.classList.add('dragging');

    if(toolId === 'vacuum'){
      sndVacuum.loop = true;
      playSound(sndVacuum);
    }

    const rect = tool.getBoundingClientRect();
    origLeft = rect.left;
    origTop = rect.top;
    startX = e.clientX;
    startY = e.clientY;

    tool.style.position = 'fixed';
    tool.style.left = origLeft + 'px';
    tool.style.top = origTop + 'px';
    tool.style.width = rect.width + 'px';
    tool.style.margin = '0';
    tool.style.transition = 'none';
  }

  function onPointerMove(e){
    if(!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    tool.style.left = (origLeft + dx) + 'px';
    tool.style.top = (origTop + dy) + 'px';

    // vacuum cleans continuously while being swept over mess — no need to
    // release and re-grab it between pieces
    if(toolId === 'vacuum'){
      tryCleanNearby();
    }
  }

  function returnHome(){
    if(toolId === 'vacuum'){
      try{ sndVacuum.pause(); }catch(e){}
      safeSeekToStart(sndVacuum);
      sndVacuum.loop = false;
    }
    tool.style.transition = 'left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1)';
    tool.style.left = origLeft + 'px';
    tool.style.top = origTop + 'px';
    setTimeout(()=>{
      tool.style.position = '';
      tool.style.left = '';
      tool.style.top = '';
      tool.style.width = '';
      tool.style.margin = '';
      tool.style.transition = '';
      tool.classList.remove('dragging');
    }, 360);
  }

  function findNearbyMess(){
    const toolRect = tool.getBoundingClientRect();
    const toolCenter = { x: toolRect.left + toolRect.width/2, y: toolRect.top + toolRect.height/2 };
    const sRect = stageRect();

    const overStage = toolCenter.x > sRect.left && toolCenter.x < sRect.right &&
                       toolCenter.y > sRect.top && toolCenter.y < sRect.bottom;
    if(!overStage) return null;

    const messEls = getMessElements();
    let nearest = null, nearestDist = Infinity;
    messEls.forEach(m=>{
      const r = m.getBoundingClientRect();
      const c = { x:r.left + r.width/2, y:r.top + r.height/2 };
      const d = Math.hypot(c.x - toolCenter.x, c.y - toolCenter.y);
      if(d < nearestDist){ nearestDist = d; nearest = m; }
    });
    const threshold = Math.max(sRect.width, sRect.height) * 0.16;
    return (nearest && nearestDist < threshold) ? nearest : null;
  }

  // vacuum-only: clean whatever mess it's currently hovering, mid-drag
  function tryCleanNearby(){
    const nearest = findNearbyMess();
    if(nearest){
      cleanupMess(nearest);
      showToast('أحسنت! تم التنظيف 🧹', true);
    }
  }

  function onPointerUp(e){
    if(!dragging) return;
    dragging = false;
    tool.releasePointerCapture(pointerId);

    if(toolId === 'vacuum'){
      // catch a plain tap-and-drop with no intermediate move events
      tryCleanNearby();
    } else {
      const nearest = findNearbyMess();
      if(nearest){
        playSound(sndTryAgain);
        showToast('حاول مرة أخرى!', false);
        nearest.animate([
          { transform: nearest.style.transform },
          { transform: nearest.style.transform + ' translateX(6px)' },
          { transform: nearest.style.transform + ' translateX(-6px)' },
          { transform: nearest.style.transform }
        ], { duration: 260 });
      }
    }
    returnHome();
  }

  tool.addEventListener('pointerdown', onPointerDown);
  tool.addEventListener('pointermove', onPointerMove);
  tool.addEventListener('pointerup', onPointerUp);
  tool.addEventListener('pointercancel', onPointerUp);
}

['lamp','chair','vacuum'].forEach(setupDrag);

function resetGame(){
  // clear any remaining mess nodes and rebuild fresh
  stage.querySelectorAll('.mess').forEach(el => el.remove());
  cleaned = 0;
  updateProgress();
  buildMess();

  document.getElementById('success').classList.remove('show');

  // stop any lingering vacuum sound
  try{ sndVacuum.pause(); sndVacuum.loop = false; }catch(e){}
  safeSeekToStart(sndVacuum);

  // send the child back through the start screen for a full replay
  appEl.classList.add('pre-start');
  startScreen.classList.remove('hidden');
}

document.getElementById('replayBtn').addEventListener('click', resetGame);

// ---- Start screen ----
const appEl = document.getElementById('app');
const startScreen = document.getElementById('startScreen');
document.getElementById('startBtn').addEventListener('click', ()=>{
  // Audio elements played via setTimeout/other deferred triggers lose the
  // "direct user gesture" context that strict mobile browsers (notably iOS
  // Safari) require for audio.play() to be allowed. Priming each one with
  // a play+immediate-pause right here, synchronously inside the click
  // handler, unlocks them so the later delayed calls actually work.
  [sndNarration, sndVacuum, sndTryAgain].forEach(a=>{
    try{
      const p = a.play();
      if(p && p.then){
        p.then(()=>{ a.pause(); safeSeekToStart(a); }).catch(()=>{});
      } else {
        a.pause();
      }
    }catch(e){}
  });

  playSound(sndStart);
  appEl.classList.remove('pre-start');
  startScreen.classList.add('hidden');
  setTimeout(()=>{ playSound(sndNarration); }, 2000);
});
</script>
